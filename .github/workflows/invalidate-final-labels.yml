name: Platform canary / invalidate final labels

on:
  pull_request_target:
    branches: [main]
    types: [synchronize, reopened, converted_to_draft]

permissions: {}

concurrency:
  group: invalidate-final-${{ github.repository_id }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  invalidate-final-labels:
    name: Remove stale final labels
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: read
    env:
      CI_PLATFORM_ROLE: label-controller
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out the exact trusted base action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          sparse-checkout: .github/actions/invalidate-final-labels
      - name: Remove labels from the exact lifecycle head
        uses: ./.github/actions/invalidate-final-labels
        with:
          pull_request_number: ${{ github.event.pull_request.number }}
          event_head_sha: ${{ github.event.pull_request.head.sha }}
          lifecycle_event: ${{ github.event.action }}
          trusted_source_sha: ${{ github.event.pull_request.base.sha }}
