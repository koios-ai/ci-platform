name: LEGACY / inactive required integrity

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: >-
    required-${{ github.repository_id }}-${{
    github.event.pull_request.number || github.event.merge_group.head_sha }}
  cancel-in-progress: true

jobs:
  required:
    name: LEGACY / inactive fast diagnostics
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
    steps:
      - name: Initialize runner-scoped paths
        shell: bash
        run: |
          printf '%s\n' \
            "CHANGED_FILES_PATH=$RUNNER_TEMP/ci-platform-changed-files.json" \
            "FAST_SELECTION_PATH=$RUNNER_TEMP/ci-platform-fast-selection.json" \
            "FAST_EVIDENCE_PATH=$RUNNER_TEMP/ci-platform-fast-test-summary.json" \
            >> "$GITHUB_ENV"
      - name: Check out exact event head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          path: target
          persist-credentials: false
          ref: ${{ env.HEAD_SHA }}
      - name: Check out exact platform source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: platform
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.13"
      - name: Install pinned fast-gate tooling
        shell: bash
        run: >-
          python -m pip install --disable-pip-version-check
          PyYAML==6.0.3 ruff==0.14.14 mypy==1.19.1
          pytest==9.0.2 pytest-xdist==3.8.0
      - name: Validate event and workflow integrity
        shell: bash
        env:
          PLATFORM_REPOSITORY: ${{ job.workflow_repository }}
          PLATFORM_SHA: ${{ job.workflow_sha }}
          PLATFORM_REF: ${{ job.workflow_ref }}
          PLATFORM_FILE_PATH: ${{ job.workflow_file_path }}
        run: >-
          python platform/scripts/validate_consumer.py
          --root target
          --head-sha "$HEAD_SHA"
          --base-sha "$BASE_SHA"
          --platform-repository "$PLATFORM_REPOSITORY"
          --platform-sha "$PLATFORM_SHA"
          --platform-ref "$PLATFORM_REF"
          --platform-file-path "$PLATFORM_FILE_PATH"
      - name: Classify changed scope
        id: scope
        shell: bash
        working-directory: target
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import re
          import subprocess

          sha = re.compile(r"^[0-9a-f]{40}$")
          head = os.environ["HEAD_SHA"]
          base = os.environ["BASE_SHA"]
          if not sha.fullmatch(head) or not sha.fullmatch(base):
              raise SystemExit("event head/base SHA is malformed")
          if subprocess.check_output(
              ["git", "rev-parse", "HEAD"], text=True
          ).strip() != head:
              raise SystemExit("target checkout is not the exact event head")
          subprocess.run(
              ["git", "cat-file", "-e", f"{base}^{{commit}}"],
              check=True,
          )
          raw = subprocess.check_output(
              [
                  "git",
                  "diff",
                  "--name-only",
                  "--diff-filter=ACMRT",
                  "-z",
                  f"{base}...{head}",
              ]
          )
          decoded = raw.decode("utf-8")
          paths = sorted(set(filter(None, decoded.split("\0"))))
          for value in paths:
              candidate = pathlib.PurePosixPath(value)
              if (
                  candidate.is_absolute()
                  or ".." in candidate.parts
                  or "\\" in value
                  or "\n" in value
                  or "\r" in value
              ):
                  raise SystemExit(f"unsafe changed path: {value!r}")
              if pathlib.Path(value).is_symlink():
                  raise SystemExit(f"changed path is a symbolic link: {value!r}")
          changed_path = pathlib.Path(os.environ["CHANGED_FILES_PATH"])
          changed_path.write_text(
              json.dumps(paths, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          digest = hashlib.sha256(
              "".join(f"{path}\n" for path in paths).encode("utf-8")
          ).hexdigest()
          python_paths = [
              path
              for path in paths
              if path.endswith(".py") and pathlib.Path(path).is_file()
          ]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"changed_files_digest={digest}\n")
              output.write(f"has_python={str(bool(python_paths)).lower()}\n")
              output.write(
                  "python_paths="
                  + json.dumps(python_paths, separators=(",", ":"))
                  + "\n"
              )
          PY
      - name: Select protected-base affected tests
        id: fast-tests
        if: steps.scope.outputs.has_python == 'true'
        shell: bash
        run: >-
          python platform/scripts/fast_test_selection.py
          --root target
          --base-sha "$BASE_SHA"
          --changed-files "$CHANGED_FILES_PATH"
          --output "$FAST_SELECTION_PATH"
      - name: Scan changed files for high-confidence secrets
        shell: bash
        working-directory: target
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib
          import re

          patterns = {
              "private key": re.compile(r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----"),
              "GitHub token": re.compile(r"\b(?:gh[oprsu]_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,})\b"),
              "AWS access key": re.compile(r"\b(?:AKIA|ASIA)[A-Z0-9]{16}\b"),
              "OpenAI key": re.compile(r"\bsk-(?:proj-)?[A-Za-z0-9_-]{20,}\b"),
          }
          paths = json.loads(
              pathlib.Path(os.environ["CHANGED_FILES_PATH"]).read_text(
                  encoding="utf-8"
              )
          )
          findings = []
          for relative in paths:
              path = pathlib.Path(relative)
              if not path.is_file() or path.stat().st_size > 2_000_000:
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              for name, pattern in patterns.items():
                  if pattern.search(text):
                      findings.append(f"{relative}: {name}")
          if findings:
              raise SystemExit(
                  "high-confidence secret material detected:\n"
                  + "\n".join(findings)
              )
          PY
      - name: Lint changed Python
        if: steps.scope.outputs.has_python == 'true'
        shell: bash
        working-directory: target
        env:
          PYTHON_PATHS: ${{ steps.scope.outputs.python_paths }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          subprocess.run(
              ["ruff", "check", "--no-cache", *json.loads(os.environ["PYTHON_PATHS"])],
              check=True,
          )
          PY
      - name: Check changed Python formatting
        if: steps.scope.outputs.has_python == 'true'
        shell: bash
        working-directory: target
        env:
          PYTHON_PATHS: ${{ steps.scope.outputs.python_paths }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          subprocess.run(
              [
                  "ruff",
                  "format",
                  "--check",
                  "--no-cache",
                  *json.loads(os.environ["PYTHON_PATHS"]),
              ],
              check=True,
          )
          PY
      - name: Type-check changed Python
        if: steps.scope.outputs.has_python == 'true'
        shell: bash
        working-directory: target
        env:
          PYTHON_PATHS: ${{ steps.scope.outputs.python_paths }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          subprocess.run(
              [
                  "mypy",
                  "--follow-imports=silent",
                  "--ignore-missing-imports",
                  "--disable-error-code=import-untyped",
                  *json.loads(os.environ["PYTHON_PATHS"]),
              ],
              check=True,
          )
          PY
      - name: Compile changed Python without imports
        if: steps.scope.outputs.has_python == 'true'
        shell: bash
        working-directory: target
        env:
          PYTHON_PATHS: ${{ steps.scope.outputs.python_paths }}
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib

          for relative in json.loads(os.environ["PYTHON_PATHS"]):
              path = pathlib.Path(relative)
              source = path.read_text(encoding="utf-8")
              compile(source, relative, "exec")
          PY
      - name: Synchronize bounded fast-test environment
        if: steps.fast-tests.outputs.has_tests == 'true'
        shell: bash
        working-directory: target
        run: |
          if git cat-file -e "${BASE_SHA}:tools/sync_ci_environment.py" 2>/dev/null; then
            test -f tools/sync_ci_environment.py
            SKIP_PRECOMMIT_INSTALL=1 python tools/sync_ci_environment.py --ci
          elif git cat-file -e "${BASE_SHA}:requirements.txt" 2>/dev/null; then
            test -f requirements.txt
            if [[ -f constraints.txt ]]; then
              python -m pip install --disable-pip-version-check -r requirements.txt -c constraints.txt
            else
              python -m pip install --disable-pip-version-check -r requirements.txt
            fi
          elif git cat-file -e "${BASE_SHA}:pyproject.toml" 2>/dev/null; then
            test -f pyproject.toml
            python -m pip install --disable-pip-version-check .
          else
            echo "Protected base has no approved dependency setup." >&2
            exit 1
          fi
          python -m pip install --disable-pip-version-check \
            PyYAML==6.0.3 ruff==0.14.14 mypy==1.19.1 \
            pytest==9.0.2 pytest-xdist==3.8.0
          python -m pip check
      - name: Run protected-base affected tests
        if: steps.fast-tests.outputs.has_tests == 'true'
        shell: bash
        run: >-
          python platform/scripts/run_fast_tests.py
          --root target
          --base-sha "$BASE_SHA"
          --changed-files "$CHANGED_FILES_PATH"
          --selection "$FAST_SELECTION_PATH"
          --evidence "$FAST_EVIDENCE_PATH"
      - name: Validate changed service and documentation files
        shell: bash
        working-directory: target
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib
          import tomllib

          import yaml

          paths = json.loads(
              pathlib.Path(os.environ["CHANGED_FILES_PATH"]).read_text(
                  encoding="utf-8"
              )
          )
          for relative in paths:
              path = pathlib.Path(relative)
              if not path.is_file():
                  continue
              suffix = path.suffix.lower()
              if suffix == ".json":
                  json.loads(path.read_text(encoding="utf-8"))
              elif suffix == ".toml":
                  tomllib.loads(path.read_text(encoding="utf-8"))
              elif (
                  suffix in {".yml", ".yaml"}
                  and ".github" not in path.parts
              ):
                  yaml.safe_load(path.read_text(encoding="utf-8"))
          PY
      - name: Confirm event head remained immutable
        shell: bash
        working-directory: target
        run: |
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test -z "$(git status --porcelain)"
